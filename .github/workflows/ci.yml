      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create the database and roles (the installer's job in production)
        run: |
          createdb kite
          psql -v ON_ERROR_STOP=1 -d kite -f db/bootstrap/00_bootstrap.sql
          psql -v ON_ERROR_STOP=1 -d kite -c "ALTER ROLE kite_migrator PASSWORD 'e2e-migrator'; ALTER ROLE kite_app PASSWORD 'e2e-app';"
      - name: Build the web app into the server, and the server
        run: |
          bash scripts/build-web.sh
          dotnet build src/server/Kite.Host -c Release
      - name: Start the Nextdab stub (checks its signing against the Nextdab Admin vectors first)
        working-directory: e2e
        run: |
          npm ci
          STUB_KEY_FILE="$RUNNER_TEMP/stub-key.txt" nohup node nextdab-stub.mjs > "$RUNNER_TEMP/stub.log" 2>&1 &
          for i in $(seq 1 20); do [ -s "$RUNNER_TEMP/stub-key.txt" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/stub.log"
          test -s "$RUNNER_TEMP/stub-key.txt"
      - name: Start the KITE server
        working-directory: src/server/Kite.Host
        run: |
          export ASPNETCORE_ENVIRONMENT=Development   # only so the test licence key below is accepted
          export ASPNETCORE_URLS=http://localhost:5080
          export ConnectionStrings__App="Host=localhost;Database=kite;Username=kite_app;Password=e2e-app"
          export ConnectionStrings__Migrator="Host=localhost;Database=kite;Username=kite_migrator;Password=e2e-migrator"
          export Kite__DataDir="$RUNNER_TEMP/kite-data" Kite__Sync__Port=0
          export Kite__Licensing__ControlUrl=http://127.0.0.1:8799 Kite__Licensing__DevPublicKey="$(cat "$RUNNER_TEMP/stub-key.txt")"
          nohup dotnet bin/Release/net10.0/Kite.Host.dll > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5080/health/ready > /dev/null && break; sleep 2; done
          curl -sf http://localhost:5080/health/ready && test -s "$RUNNER_TEMP/kite-data/setup-code.txt"
      - name: Browser walk-through
        working-directory: e2e
        env:
          KITE_URL: http://localhost:5080
          SETUP_CODE_FILE: ${{ runner.temp }}/kite-data/setup-code.txt
          SHOTS_DIR: ${{ runner.temp }}/e2e-phase11-shots
        run: node phase11.mjs
      - name: Database after the walk-through (orders, receipts, invoices, returns, payments, GRNI, VAT return, ledger check, journals, audit chain)
        if: always()
        run: |
          psql -d kite -c "SELECT number, status, gross_total FROM purch.purchase_order ORDER BY created_at;"
          psql -d kite -c "SELECT r.number, l.qty, l.unit_price, l.goods_value, l.charge_share, l.stock_value FROM purch.receipt_line l JOIN purch.goods_receipt r ON r.id = l.receipt_id ORDER BY r.number, l.line_no;"
          psql -d kite -c "SELECT i.number, i.status, i.supplier_invoice_no, l.match_status, l.net_amount, l.expected_amount, l.variance_inventory, l.variance_ppv, i.override_reason FROM purch.invoice_line l JOIN purch.purchase_invoice i ON i.id = l.invoice_id ORDER BY i.number, l.line_no;"
          psql -d kite -c "SELECT source_type, kind, amount FROM purch.grni_entry ORDER BY created_at;"
          psql -d kite -c "SELECT s.name_en, l.kind, l.number, l.amount FROM purch.supplier_ledger l JOIN purch.supplier s ON s.id = l.supplier_id ORDER BY l.created_at;"
          psql -d kite -c "SELECT number, period_from, period_to, status, output_vat, input_vat, net_vat FROM tax.vat_return;"
          psql -d kite -c "SELECT a.code, sum(l.debit - l.credit) AS balance FROM acct.journal_line l JOIN acct.account a ON a.id = l.account_id GROUP BY a.code ORDER BY a.code;"
          psql -d kite -c "SELECT c.ledger, b.code, c.subledger, c.control, c.difference FROM acct.subledger_check c LEFT JOIN core.branch b ON b.id = c.branch_id WHERE c.run_id = (SELECT run_id FROM acct.subledger_check ORDER BY checked_at DESC LIMIT 1) ORDER BY c.ledger, b.code;"
          psql -d kite -c "SELECT (SELECT count(*) FROM acct.journal) AS journals, (SELECT ok FROM audit.verify_chain()) AS audit_chain_ok;"
      - name: Print screenshots for review
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/e2e-phase11-shots/*.jpg; do
            [ -f "$f" ] || continue
            echo "SHOT-BEGIN $(basename "$f")"; base64 -w 40000 "$f"; echo "SHOT-END"
          done
      - name: Server log
        if: always()
        run: |
          tail -n 200 "$RUNNER_TEMP/server.log" || true
          echo "=== stub ==="; cat "$RUNNER_TEMP/stub.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-phase11-screenshots
          path: ${{ runner.temp }}/e2e-phase11-shots/
