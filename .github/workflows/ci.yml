          Kite__DataDir: ${{ runner.temp }}/kite-data
          ASPNETCORE_URLS: http://localhost:5080
        run: |
          dotnet build src/server/Kite.Host -c Release
          cd src/server/Kite.Host
          nohup dotnet bin/Release/net10.0/Kite.Host.dll > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5080/health/ready > /dev/null && break; sleep 2; done
          curl -sf http://localhost:5080/health/ready
          test -s "$RUNNER_TEMP/kite-data/setup-code.txt"
      - name: Browser walk-through
        working-directory: e2e
        env:
          KITE_URL: http://localhost:5080
          KITE_SETUP_CODE_FILE: ${{ runner.temp }}/kite-data/setup-code.txt
          KITE_EXPECT_REAL: "1"
          SHOTS_DIR: ${{ runner.temp }}/e2e-shots
        run: npm ci && node real-server.mjs
      - name: Database after the walk-through (immutable audit chain, sync events)
        if: always()
        run: |
          psql -d kite -c "SELECT count(*) AS audit_rows, (SELECT ok FROM audit.verify_chain()) AS chain_ok FROM audit.audit_log;"
          psql -d kite -c "SELECT event_type, count(*) FROM sync.outbox GROUP BY 1 ORDER BY 1;"
          psql -d kite -c "SELECT username, totp_enabled, must_change_password FROM iam.\"user\" ORDER BY username;"
      - name: Print screenshots for review
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/e2e-shots/*.jpg; do
            [ -f "$f" ] || continue
            echo "SHOT-BEGIN $(basename "$f")"; base64 -w 40000 "$f"; echo "SHOT-END"
          done
