name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  database:
    name: Database tests (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run migrations and SQL tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash db/tests/run.sh

  server-linux:
    name: Server build and tests (Linux + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Kite.slnx
      - run: dotnet build Kite.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/Kite.UnitTests -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory TestResults
      - name: Integration tests
        env:
          KITE_TEST_PG: "Host=localhost;Port=5432;Username=postgres;Password=postgres"
        run: dotnet test tests/Kite.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx" --logger "console;verbosity=normal" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-results-linux
          path: TestResults

  server-windows:
    name: Server build and unit tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Kite.slnx -c Release
      - run: dotnet test tests/Kite.UnitTests -c Release --no-build

  web:
    name: Web app (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: src/client/apps/web/dist

  desktop:
    name: Desktop app (typecheck, tests with SQLCipher and a RAW Windows printer, POS bundle)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/client/apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: src/client
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run typecheck
      - name: A Windows printer that writes what it receives to a file (to test the spooler RAW path)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\kite-print | Out-Null
          Add-PrinterDriver -Name "Generic / Text Only"
          Add-PrinterPort -Name "C:\kite-print\receipt.bin"
          Add-Printer -Name "KITE Raw Test" -DriverName "Generic / Text Only" -PortName "C:\kite-print\receipt.bin"
          Get-Printer -Name "KITE Raw Test" | Format-List Name, DriverName, PortName
      - name: Desktop tests (emergency store, printers, offline PIN check)
        env:
          KITE_TEST_WINDOWS_PRINTER: KITE Raw Test
          KITE_TEST_WINDOWS_PRINTER_FILE: C:\kite-print\receipt.bin
        run: npm test
      - name: Bundle the POS for emergency mode
        run: npm run bundle-web
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-dist
          path: |
            src/client/apps/desktop/dist
            src/client/apps/desktop/static

  load-test:
    name: Phase 4 exit gate (20 terminals, sales, returns, voids, shifts, stock and journals reconciled)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Kite.slnx -c Release
      - name: 20 terminals, 40 sales each, at the same time
        env:
          KITE_TEST_PG: "Host=localhost;Port=5432;Username=postgres;Password=postgres"
          KITE_LOAD_TERMINALS: "20"
          KITE_LOAD_SALES: "40"
          KITE_LOAD_REPORT: ${{ github.workspace }}/load-report.json
        run: dotnet test tests/Kite.IntegrationTests -c Release --no-build --filter "FullyQualifiedName~Phase4LoadTests" --logger "console;verbosity=detailed"
      - name: Report
        if: always()
        run: |
          test -f load-report.json && cat load-report.json
          test -f load-report.json && python3 -c "import json;d=json.load(open('load-report.json'));print('### Phase 4 load test\n\n'+d['summary']+'\n\nCash moved: %.3f OMR, net revenue %.3f OMR, VAT %.3f OMR. Every shift closed with zero variance; balances, valuation, journals and sales reconciled.' % (d['cash'], d['revenue'], d['vat']))" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-report
          path: load-report.json

  pocs-linux:
    name: Proofs of concept (QuestPDF Arabic, ESC/POS raster, SQLCipher)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: QuestPDF Arabic invoice
        run: dotnet run --project poc/questpdf-arabic -c Release -- poc/questpdf-arabic/output/arabic-invoice.pdf
      - name: Inspect the PDF (fonts, text, page image for review)
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          pdffonts poc/questpdf-arabic/output/arabic-invoice.pdf
          pdftotext -layout poc/questpdf-arabic/output/arabic-invoice.pdf - | head -20
          pdftoppm -r 60 -png -singlefile poc/questpdf-arabic/output/arabic-invoice.pdf poc/questpdf-arabic/output/page1
          echo "PAGE1-PNG-BASE64-BEGIN"; base64 -w0 poc/questpdf-arabic/output/page1.png; echo; echo "PAGE1-PNG-BASE64-END"
      - name: Arabic raster receipt (ESC/POS bytes)
        working-directory: poc/escpos-raster
        run: npm ci && npm start
      - name: SQLCipher encrypted emergency store
        working-directory: poc/sqlcipher-store
        run: npm ci && npm start
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc-output-linux
          path: poc/**/output/

  poc-windows-postgres:
    name: Proof of concept (PostgreSQL as a Windows service)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL as a service, bootstrap and migrate
        shell: pwsh
        run: ./poc/postgres-windows-service/install-service-poc.ps1
      - name: SQLCipher emergency store on Windows
        working-directory: poc/sqlcipher-store
        run: npm ci && npm start

  e2e:
    name: End-to-end (real server, PostgreSQL and a browser, Arabic and English)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create the database and roles (the installer's job in production)
        run: |
          createdb kite
          psql -v ON_ERROR_STOP=1 -d kite -f db/bootstrap/00_bootstrap.sql
          psql -v ON_ERROR_STOP=1 -d kite -c "ALTER ROLE kite_migrator PASSWORD 'e2e-migrator'; ALTER ROLE kite_app PASSWORD 'e2e-app';"
      - name: Build the web app into the server
        run: bash scripts/build-web.sh
      - name: Build and start the KITE server
        env:
          ConnectionStrings__App: Host=localhost;Database=kite;Username=kite_app;Password=e2e-app
          ConnectionStrings__Migrator: Host=localhost;Database=kite;Username=kite_migrator;Password=e2e-migrator
          Kite__DataDir: ${{ runner.temp }}/kite-data
          ASPNETCORE_URLS: http://localhost:5080
        run: |
          dotnet build src/server/Kite.Host -c Release
          cd src/server/Kite.Host
          nohup dotnet bin/Release/net10.0/Kite.Host.dll > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5080/health/ready > /dev/null && break; sleep 2; done
          curl -sf http://localhost:5080/health/ready
          test -s "$RUNNER_TEMP/kite-data/setup-code.txt"
      - name: Browser walk-through
        working-directory: e2e
        env:
          KITE_URL: http://localhost:5080
          KITE_SETUP_CODE_FILE: ${{ runner.temp }}/kite-data/setup-code.txt
          KITE_EXPECT_REAL: "1"
          SHOTS_DIR: ${{ runner.temp }}/e2e-shots
        run: npm ci && node real-server.mjs
      - name: Database after the walk-through (immutable audit chain, sync events)
        if: always()
        run: |
          psql -d kite -c "SELECT count(*) AS audit_rows, (SELECT ok FROM audit.verify_chain()) AS chain_ok FROM audit.audit_log;"
          psql -d kite -c "SELECT event_type, count(*) FROM sync.outbox GROUP BY 1 ORDER BY 1;"
          psql -d kite -c "SELECT username, totp_enabled, must_change_password FROM iam.\"user\" ORDER BY username;"
      - name: Print screenshots for review
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/e2e-shots/*.jpg; do
            [ -f "$f" ] || continue
            echo "SHOT-BEGIN $(basename "$f")"; base64 -w 40000 "$f"; echo "SHOT-END"
          done
      - name: Server log
        if: always()
        run: tail -n 200 "$RUNNER_TEMP/server.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e-shots/

  e2e-phase3:
    name: End-to-end Phase 3 (head office + branch server, licence, backups with a verified restore)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGBIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Head office database - PostgreSQL 17 on the runner (PGDG), with WAL archiving and replication for the backup agent
        run: |
          set -e
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          for codename in "$VERSION_CODENAME" noble; do
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $codename-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            if sudo apt-get update -q 2>&1 | tee /tmp/apt.log && ! grep -qE "^(E|Err):.*pgdg" /tmp/apt.log; then break; fi
          done
          sudo apt-get install -y -q postgresql-17 postgresql-client-17
          # The runner image has its own (newer) PostgreSQL cluster; KITE's production versions are 16/17, so a 17 cluster is made on its own port.
          port=5435
          sudo pg_lsclusters -h | awk '$1 == "17" && $2 == "main"' | grep -q . || sudo pg_createcluster 17 main --port "$port"
          sudo pg_ctlcluster 17 main start
          sudo pg_lsclusters
          echo "MAINPG_PORT=$port" >> "$GITHUB_ENV"
          sudo mkdir -p /var/lib/postgresql/wal-archive && sudo chown postgres:postgres /var/lib/postgresql/wal-archive
          sudo -u postgres psql -p "$port" -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD 'postgres'" -c "ALTER SYSTEM SET wal_level = replica" \
            -c "ALTER SYSTEM SET archive_mode = on" -c "ALTER SYSTEM SET archive_command = 'cp %p /var/lib/postgresql/wal-archive/%f'"
          sudo pg_ctlcluster 17 main restart
          sleep 3
          psql -p "$port" -c "SELECT version()" -c "SHOW archive_mode" -c "SHOW wal_level"
          sudo grep -E "^host +replication" /etc/postgresql/17/main/pg_hba.conf
      - name: Create both KITE databases and roles (the installer's job in production)
        run: |
          for port in $MAINPG_PORT 5434; do
            createdb -p $port kite
            psql -p $port -v ON_ERROR_STOP=1 -d kite -f db/bootstrap/00_bootstrap.sql
            psql -p $port -v ON_ERROR_STOP=1 -d kite -c "ALTER ROLE kite_migrator PASSWORD 'e2e-migrator'; ALTER ROLE kite_app PASSWORD 'e2e-app'; ALTER ROLE kite_backup PASSWORD 'e2e-backup';"
          done
      - name: Build the web app into the server, and the server
        run: |
          bash scripts/build-web.sh
          dotnet build src/server/Kite.Host -c Release
      - name: Start the Nextdab stub (checks its signing against the Nextdab Admin vectors first)
        working-directory: e2e
        run: |
          npm ci
          STUB_KEY_FILE="$RUNNER_TEMP/stub-key.txt" nohup node nextdab-stub.mjs > "$RUNNER_TEMP/stub.log" 2>&1 &
          for i in $(seq 1 20); do [ -s "$RUNNER_TEMP/stub-key.txt" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/stub.log"
          test -s "$RUNNER_TEMP/stub-key.txt"
      - name: Start the head office server (role main, sync TLS port 5443, backups on)
        working-directory: src/server/Kite.Host
        run: |
          export ASPNETCORE_ENVIRONMENT=Development   # only so the test licence key below is accepted
          export ASPNETCORE_URLS=http://localhost:5080
          export ConnectionStrings__App="Host=localhost;Port=$MAINPG_PORT;Database=kite;Username=kite_app;Password=e2e-app"
          export ConnectionStrings__Migrator="Host=localhost;Port=$MAINPG_PORT;Database=kite;Username=kite_migrator;Password=e2e-migrator"
          export ConnectionStrings__Backup="Host=localhost;Port=$MAINPG_PORT;Database=kite;Username=kite_backup;Password=e2e-backup"
          export Kite__DataDir="$RUNNER_TEMP/main-data" Kite__Sync__Port=5443 Kite__Sync__Hosts=localhost
          export Kite__Licensing__ControlUrl=http://127.0.0.1:8799 Kite__Licensing__DevPublicKey="$(cat "$RUNNER_TEMP/stub-key.txt")"
          export Kite__Backup__PgBin="$PGBIN" Kite__Backup__Folder="$RUNNER_TEMP/backups"
          nohup dotnet bin/Release/net10.0/Kite.Host.dll > "$RUNNER_TEMP/main.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5080/health/ready > /dev/null && break; sleep 2; done
          curl -sf http://localhost:5080/health/ready && test -s "$RUNNER_TEMP/main-data/setup-code.txt"
      - name: Start the branch server (joins later from the browser, heartbeat every 5 s)
        working-directory: src/server/Kite.Host
        run: |
          export ASPNETCORE_ENVIRONMENT=Development
          export ASPNETCORE_URLS=http://localhost:5081
          export ConnectionStrings__App="Host=localhost;Port=5434;Database=kite;Username=kite_app;Password=e2e-app"
          export ConnectionStrings__Migrator="Host=localhost;Port=5434;Database=kite;Username=kite_migrator;Password=e2e-migrator"
          export Kite__DataDir="$RUNNER_TEMP/branch-data" Kite__Sync__Port=0 Kite__Sync__HeartbeatSeconds=5
          export Kite__Licensing__CheckinEnabled=false Kite__Licensing__DevPublicKey="$(cat "$RUNNER_TEMP/stub-key.txt")"
          nohup dotnet bin/Release/net10.0/Kite.Host.dll > "$RUNNER_TEMP/branch.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5081/health/ready > /dev/null && break; sleep 2; done
          curl -sf http://localhost:5081/health/ready && test -s "$RUNNER_TEMP/branch-data/setup-code.txt"
      - name: Browser walk-through of the Phase 3 exit gate
        working-directory: e2e
        env:
          MAIN_URL: http://localhost:5080
          BRANCH_URL: http://localhost:5081
          STUB_URL: http://127.0.0.1:8799
          MAIN_SETUP_CODE_FILE: ${{ runner.temp }}/main-data/setup-code.txt
          BRANCH_SETUP_CODE_FILE: ${{ runner.temp }}/branch-data/setup-code.txt
          RECOVERY_KEY_FILE: ${{ runner.temp }}/recovery-key.txt
          SHOTS_DIR: ${{ runner.temp }}/e2e-phase3-shots
        run: node phase3.mjs
      - name: Restore the latest backup by hand on a clean database with the printed recovery key (runbook 19.5)
        run: |
          set -e
          file=$(ls -t "$RUNNER_TEMP"/backups/logical/*.kbak | head -1)
          echo "backup file: $file ($(stat -c %s "$file") bytes)"
          dotnet src/server/Kite.Host/bin/Release/net10.0/Kite.Host.dll backup-decrypt --in "$file" --out "$RUNNER_TEMP/restore.dump" --recovery-key "$(cat "$RUNNER_TEMP/recovery-key.txt")"
          createdb -p $MAINPG_PORT kite_restore_check
          "$PGBIN/pg_restore" -p $MAINPG_PORT --no-owner --no-acl --exit-on-error -d kite_restore_check "$RUNNER_TEMP/restore.dump"
          psql -p $MAINPG_PORT -d kite_restore_check -v ON_ERROR_STOP=1 -c "SELECT (SELECT ok FROM audit.verify_chain()) AS audit_chain_ok, (SELECT count(*) FROM audit.audit_log) AS audit_rows, (SELECT count(*) FROM core.branch) AS branches, (SELECT count(*) FROM lic.licence) AS licences"
          test "$(psql -p $MAINPG_PORT -d kite_restore_check -tAc "SELECT ok FROM audit.verify_chain()")" = "t"
          test "$(psql -p $MAINPG_PORT -d kite_restore_check -tAc "SELECT count(*) FROM core.branch")" -ge 2
          echo "wrong recovery key must fail:"
          ! dotnet src/server/Kite.Host/bin/Release/net10.0/Kite.Host.dll backup-decrypt --in "$file" --out "$RUNNER_TEMP/wrong.dump" --recovery-key "AAAA-AAAA-AAAA-AAAA-AAAA-AAAA-AAAA-AAAA-AAAA-AAAA-AAAA-AAAA-AAAA"
      - name: Databases after the walk-through
        if: always()
        run: |
          psql -p $MAINPG_PORT -d kite -c "SELECT kind, status, trigger, size_bytes, checks->>'journals_balanced' AS balanced, checks->>'audit_chain_intact' AS chain, error FROM ops.backup_run ORDER BY started_at;" || true
          psql -p $MAINPG_PORT -d kite -c "SELECT s.role, s.name, s.status, b.code FROM core.server s LEFT JOIN core.branch b ON b.id = s.branch_id;" || true
          psql -p $MAINPG_PORT -d kite -c "SELECT serial, kind, revoked_at IS NOT NULL AS revoked, revoked_reason FROM pki.certificate ORDER BY issued_at;" || true
          psql -p $MAINPG_PORT -d kite -c "SELECT id, kind, valid_until, source, is_current FROM lic.licence ORDER BY imported_at;" || true
          psql -p 5434 -d kite -c "SELECT role, name, status FROM core.server;" || true
          ls -la "$RUNNER_TEMP"/backups/* || true
      - name: Print screenshots for review
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/e2e-phase3-shots/*.jpg; do
            [ -f "$f" ] || continue
            echo "SHOT-BEGIN $(basename "$f")"; base64 -w 40000 "$f"; echo "SHOT-END"
          done
      - name: Server logs
        if: always()
        run: |
          echo "=== head office ==="; tail -n 300 "$RUNNER_TEMP/main.log" || true
          echo "=== branch ==="; tail -n 100 "$RUNNER_TEMP/branch.log" || true
          echo "=== stub ==="; cat "$RUNNER_TEMP/stub.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-phase3-screenshots
          path: ${{ runner.temp }}/e2e-phase3-shots/

  e2e-phase4:
    name: End-to-end Phase 4 (browser till, approvals, receipts, return, blind close, Z, A4 invoice, books agree)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create the database and roles (the installer's job in production)
        run: |
          createdb kite
          psql -v ON_ERROR_STOP=1 -d kite -f db/bootstrap/00_bootstrap.sql
          psql -v ON_ERROR_STOP=1 -d kite -c "ALTER ROLE kite_migrator PASSWORD 'e2e-migrator'; ALTER ROLE kite_app PASSWORD 'e2e-app';"
      - name: Build the web app into the server, and the server
        run: |
          bash scripts/build-web.sh
          dotnet build src/server/Kite.Host -c Release
      - name: Start the Nextdab stub (checks its signing against the Nextdab Admin vectors first)
        working-directory: e2e
        run: |
          npm ci
          STUB_KEY_FILE="$RUNNER_TEMP/stub-key.txt" nohup node nextdab-stub.mjs > "$RUNNER_TEMP/stub.log" 2>&1 &
          for i in $(seq 1 20); do [ -s "$RUNNER_TEMP/stub-key.txt" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/stub.log"
          test -s "$RUNNER_TEMP/stub-key.txt"
      - name: Start the KITE server
        working-directory: src/server/Kite.Host
        run: |
          export ASPNETCORE_ENVIRONMENT=Development   # only so the test licence key below is accepted
          export ASPNETCORE_URLS=http://localhost:5080
          export ConnectionStrings__App="Host=localhost;Database=kite;Username=kite_app;Password=e2e-app"
          export ConnectionStrings__Migrator="Host=localhost;Database=kite;Username=kite_migrator;Password=e2e-migrator"
          export Kite__DataDir="$RUNNER_TEMP/kite-data" Kite__Sync__Port=0
          export Kite__Licensing__ControlUrl=http://127.0.0.1:8799 Kite__Licensing__DevPublicKey="$(cat "$RUNNER_TEMP/stub-key.txt")"
          nohup dotnet bin/Release/net10.0/Kite.Host.dll > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5080/health/ready > /dev/null && break; sleep 2; done
          curl -sf http://localhost:5080/health/ready && test -s "$RUNNER_TEMP/kite-data/setup-code.txt"
      - name: Browser walk-through
        working-directory: e2e
        env:
          KITE_URL: http://localhost:5080
          SETUP_CODE_FILE: ${{ runner.temp }}/kite-data/setup-code.txt
          SHOTS_DIR: ${{ runner.temp }}/e2e-phase4-shots
        run: node phase4.mjs
      - name: Database after the walk-through (stock, journals, audit chain)
        if: always()
        run: |
          psql -d kite -c "SELECT (SELECT count(*) FROM sales.sale) AS documents, (SELECT count(*) FROM acct.journal) AS journals, (SELECT ok FROM audit.verify_chain()) AS audit_chain_ok;"
          psql -d kite -c "SELECT v.sku, b.qty FROM inv.stock_balance b JOIN catalog.variant v ON v.id = b.variant_id ORDER BY v.sku;"
      - name: Print screenshots for review
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/e2e-phase4-shots/*.jpg; do
            [ -f "$f" ] || continue
            echo "SHOT-BEGIN $(basename "$f")"; base64 -w 40000 "$f"; echo "SHOT-END"
          done
      - name: Server log
        if: always()
        run: |
          tail -n 200 "$RUNNER_TEMP/server.log" || true
          echo "=== stub ==="; cat "$RUNNER_TEMP/stub.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-phase4-screenshots
          path: ${{ runner.temp }}/e2e-phase4-shots/
