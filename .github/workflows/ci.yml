name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  database:
    name: Database tests (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run migrations and SQL tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash db/tests/run.sh

  server-linux:
    name: Server build and tests (Linux + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Kite.slnx
      - run: dotnet build Kite.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/Kite.UnitTests -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory TestResults
      - name: Integration tests
        env:
          KITE_TEST_PG: "Host=localhost;Port=5432;Username=postgres;Password=postgres"
        run: dotnet test tests/Kite.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx" --logger "console;verbosity=normal" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-results-linux
          path: TestResults

  server-windows:
    name: Server build and unit tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Kite.slnx -c Release
      - run: dotnet test tests/Kite.UnitTests -c Release --no-build

  web:
    name: Web app (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: src/client/apps/web/dist

  desktop:
    name: Desktop app (typecheck, tests with SQLCipher and a RAW Windows printer, POS bundle)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/client/apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: src/client
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run typecheck
      - name: A Windows printer that writes what it receives to a file (to test the spooler RAW path)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\kite-print | Out-Null
          Add-PrinterDriver -Name "Generic / Text Only"
          Add-PrinterPort -Name "C:\kite-print\receipt.bin"
          Add-Printer -Name "KITE Raw Test" -DriverName "Generic / Text Only" -PortName "C:\kite-print\receipt.bin"
          Get-Printer -Name "KITE Raw Test" | Format-List Name, DriverName, PortName
      - name: Desktop tests (emergency store, printers, offline PIN check)
        env:
          KITE_TEST_WINDOWS_PRINTER: KITE Raw Test
          KITE_TEST_WINDOWS_PRINTER_FILE: C:\kite-print\receipt.bin
        run: npm test
      - name: Bundle the POS for emergency mode
        run: npm run bundle-web
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-dist
          path: |
            src/client/apps/desktop/dist
            src/client/apps/desktop/static

  load-test:
    name: Phase 4 exit gate (20 terminals, sales, returns, voids, shifts, stock and journals reconciled)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Kite.slnx -c Release
      - name: 20 terminals, 40 sales each, at the same time
        env:
          KITE_TEST_PG: "Host=localhost;Port=5432;Username=postgres;Password=postgres"
          KITE_LOAD_TERMINALS: "20"
          KITE_LOAD_SALES: "40"
          KITE_LOAD_REPORT: ${{ github.workspace }}/load-report.json
        run: dotnet test tests/Kite.IntegrationTests -c Release --no-build --filter "FullyQualifiedName~Phase4LoadTests" --logger "console;verbosity=detailed"
      - name: Report
        if: always()
        run: |
          test -f load-report.json && cat load-report.json
          test -f load-report.json && python3 -c "import json;d=json.load(open('load-report.json'));print('### Phase 4 load test\n\n'+d['summary']+'\n\nCash moved: %.3f OMR, net revenue %.3f OMR, VAT %.3f OMR. Every shift closed with zero variance; balances, valuation, journals and sales reconciled.' % (d['cash'], d['revenue'], d['vat']))" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-report
          path: load-report.json

  phase5-exit-gate:
    name: Phase 5 exit gate (conditions, inspections and refurbishment costs flow to unit cost, 10 workers at once)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The device vectors are what the independent Python implementation writes
        run: |
          python3 tests/vectors/generators/device_vectors.py
          git diff --exit-code tests/vectors/device-math-vectors.json
      - run: dotnet build Kite.slnx -c Release
      - name: 10 workers, 12 phones each, random lives at the same time
        env:
          KITE_TEST_PG: "Host=localhost;Port=5432;Username=postgres;Password=postgres"
          KITE_P5_WORKERS: "10"
          KITE_P5_PHONES: "12"
          KITE_P5_REPORT: ${{ github.workspace }}/phase5-report.json
        run: dotnet test tests/Kite.IntegrationTests -c Release --no-build --filter "FullyQualifiedName~Phase5CostFlowTests" --logger "console;verbosity=detailed"
      - name: Report
        if: always()
        run: |
          test -f phase5-report.json && cat phase5-report.json
          test -f phase5-report.json && python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          d = json.load(open('phase5-report.json'))
          print('### Phase 5 exit gate\n')
          print(f"{d['workers']} workers, {d['phones']} phones in {d['seconds']} s. Steps: " + ', '.join(f"{k} {v}" for k, v in d['steps'].items()) + '.\n')
          print('| Account | Expected | Moved |\n| --- | ---: | ---: |')
          for a, v in d['accounts'].items(): print(f"| {a} | {v['expected']:.3f} | {v['actual']:.3f} |")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5-report
          path: phase5-report.json

  phase6-exit-gate:
    name: Phase 6 exit gate (IMEI uniqueness and verification points under concurrency, 20 tills, 10 branch servers)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Kite.slnx -c Release
      - name: 20 receivers and 20 tills on one server; 10 branch servers and head office on overlapping IMEIs
        env:
          KITE_TEST_PG: "Host=localhost;Port=5432;Username=postgres;Password=postgres"
          KITE_P6_TILLS: "20"
          KITE_P6_BRANCHES: "10"
          KITE_P6_ROUNDS: "8"
          KITE_P6_UNITS: "8"
          KITE_P6_REPORT: ${{ github.workspace }}/phase6-report.json
        run: dotnet test tests/Kite.IntegrationTests -c Release --no-build --filter "FullyQualifiedName~Phase6ExitGateTests" --logger "console;verbosity=detailed"
      - name: Report
        if: always()
        run: |
          test -f phase6-report.json && cat phase6-report.json
          test -f phase6-report.json && python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          d = json.load(open('phase6-report.json'))
          print('### Phase 6 exit gate\n')
          print('| Measure | Value |\n| --- | ---: |')
          for k, v in d.items(): print(f"| {k} | {v} |")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase6-report
          path: phase6-report.json

  phase7-exit-gate:
    name: Phase 7 exit gate (all four trade-in settlement types and margin resales post the expected journals, 20 tills at once)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The trade-in vectors are what the independent Python implementation writes
        run: |
          python3 tests/vectors/generators/tradein_vectors.py
          git diff --exit-code tests/vectors/tradein-math-vectors.json
      - run: dotnet build Kite.slnx -c Release
      - name: 20 tills, 10 rounds each, every settlement type, voids, store credit and margin resales at the same time
        env:
          KITE_TEST_PG: "Host=localhost;Port=5432;Username=postgres;Password=postgres"
          KITE_P7_TILLS: "20"
          KITE_P7_ROUNDS: "10"
          KITE_P7_REPORT: ${{ github.workspace }}/phase7-report.json
        run: dotnet test tests/Kite.IntegrationTests -c Release --no-build --filter "FullyQualifiedName~Phase7ExitGateTests" --logger "console;verbosity=detailed"
      - name: Report
        if: always()
        run: |
          test -f phase7-report.json && cat phase7-report.json
          test -f phase7-report.json && python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          d = json.load(open('phase7-report.json'))
          print('### Phase 7 exit gate\n')
          print(f"{d['tills']} tills x {d['rounds']} rounds: {d['accepted']} trade-ins accepted, {d['settled']} settled, {d['sales']} sales, {d['voids']} voids, "
                f"{d['storeCreditSales']} store-credit sales, {d['marginResales']} margin resales.\n")
          print('| Account | Expected | Moved |\n| --- | ---: | ---: |')
          for a, v in d['accounts'].items(): print(f"| {a} | {v['expected']:.3f} | {v['actual']:.3f} |")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase7-report
          path: phase7-report.json

  phase8-exit-gate:
    name: Phase 8 exit gate (every repair transition at 4 branches at once; approvals, deposits, parts, deliveries post the expected journals)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The repair vectors are what the independent Python implementation writes
        run: |
          python3 tests/vectors/generators/repair_vectors.py
          git diff --exit-code tests/vectors/repair-math-vectors.json
      - run: dotnet build Kite.slnx -c Release
      - name: 4 branches, 3 workers each, 4 rounds; all 132 transitions per branch; every approval method, deposits, parts, deliveries, cancellations, warranty claims
        env:
          KITE_TEST_PG: "Host=localhost;Port=5432;Username=postgres;Password=postgres"
          KITE_P8_BRANCHES: "4"
          KITE_P8_WORKERS: "3"
          KITE_P8_ROUNDS: "4"
          KITE_P8_REPORT: ${{ github.workspace }}/phase8-report.json
        run: dotnet test tests/Kite.IntegrationTests -c Release --no-build --filter "FullyQualifiedName~Phase8ExitGateTests" --logger "console;verbosity=detailed"
      - name: Report
        if: always()
        run: |
          test -f phase8-report.json && cat phase8-report.json
          test -f phase8-report.json && python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          d = json.load(open('phase8-report.json'))
          print('### Phase 8 exit gate\n')
          print(f"{d['branches']} branches x {d['workersPerBranch']} workers x {d['rounds']} rounds in {d['seconds']} s. "
                f"Transitions at every branch: {d['transitions']['perBranch']['allowed']} allowed passed, {d['transitions']['perBranch']['refused']} others refused.\n")
          print(', '.join(f"{v} {k}" for k, v in d['counts'].items()) + '\n')
          print('| Account | Expected | Moved |\n| --- | ---: | ---: |')
          for a, v in d['accounts'].items(): print(f"| {a} | {v['expected']:.3f} | {v['actual']:.3f} |")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase8-report
          path: phase8-report.json

  phase9-exit-gate:
    name: Phase 9 exit gate (scarce parts, racing tills and fillers, commissions generated once, corrections and payouts at 4 branches at once)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The commission vectors are what the independent Python implementation writes
        run: |
          python3 tests/vectors/generators/commission_vectors.py
          git diff --exit-code tests/vectors/commission-math-vectors.json
      - run: dotnet build Kite.slnx -c Release
      - name: 4 branches, 3 tills each, 6 repairs per till; parts short and filled oldest first, commissions on each basis, generator x10, corrections, racing payouts
        env:
          KITE_TEST_PG: "Host=localhost;Port=5432;Username=postgres;Password=postgres"
          KITE_P9_BRANCHES: "4"
          KITE_P9_TILLS: "3"
          KITE_P9_JOBS: "6"
          KITE_P9_REPORT: ${{ github.workspace }}/phase9-report.json
        run: dotnet test tests/Kite.IntegrationTests -c Release --no-build --filter "FullyQualifiedName~Phase9ExitGateTests" --logger "console;verbosity=detailed"
      - name: Report
        if: always()
        run: |
          test -f phase9-report.json && cat phase9-report.json
          test -f phase9-report.json && python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          d = json.load(open('phase9-report.json'))
          print('### Phase 9 exit gate\n')
          print(f"{d['branches']} branches x {d['tillsPerBranch']} tills x {d['jobsPerTill']} repairs in {d['seconds']} s.\n")
          print(', '.join(f"{v} {k}" for k, v in d['counts'].items()) + '\n')
          print('| Account | Expected | Moved |\n| --- | ---: | ---: |')
          for a, v in d['accounts'].items(): print(f"| {a} | {v['expected']:.3f} | {v['actual']:.3f} |")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase9-report
          path: phase9-report.json

  phase10-exit-gate:
    name: Phase 10 exit gate (online limits at head office, two branches offline both selling on credit within their allowances, breaches held on sync, statements reconcile)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The credit vectors are what the independent Python implementation writes
        run: |
          python3 tests/vectors/generators/credit_vectors.py
          git diff --exit-code tests/vectors/credit-math-vectors.json
      - run: dotnet build Kite.slnx -c Release
      - name: 12 tills racing for one limit online, 4 branch servers selling offline on credit, push, breaches and holds, payments across branches, statements and the ledger check
        env:
          KITE_TEST_PG: "Host=localhost;Port=5432;Username=postgres;Password=postgres"
          KITE_P10_TILLS: "12"
          KITE_P10_BRANCHES: "4"
          KITE_P10_CUSTOMERS: "10"
          KITE_P10_ATTEMPTS: "10"
          KITE_P10_REPORT: ${{ github.workspace }}/phase10-report.json
        run: dotnet test tests/Kite.IntegrationTests -c Release --no-build --filter "FullyQualifiedName~Phase10ExitGateTests" --logger "console;verbosity=detailed"
      - name: Report
        if: always()
        run: |
          test -f phase10-report.json && cat phase10-report.json
          test -f phase10-report.json && python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          d = json.load(open('phase10-report.json'))
          print('### Phase 10 exit gate\n')
          print(f"{d['tills']} tills online, {d['branchServers']} branch servers offline, {d['customers']} customers, {d['attempts']} attempts each, in {d['seconds']} s.\n")
          print('| What | Count |\n| --- | ---: |')
          for k, v in d['counts'].items(): print(f"| {k} | {v} |")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase10-report
          path: phase10-report.json

  phase11-exit-gate:
    name: Phase 11 exit gate (races on receiving, invoicing, paying and returning never overrun; a full day at three branches; the quarter closed and its VAT return filed; every subledger equals its control account, trial balances balance, interbranch eliminates)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The purchase vectors are what the independent Python implementation writes
        run: |
          python3 tests/vectors/generators/purchase_vectors.py
          git diff --exit-code tests/vectors/purchase-math-vectors.json
      - run: dotnet build Kite.slnx -c Release
      - name: 16 workers racing on one order line, one receipt line, one invoice and one return; then a full day at three branches, the VAT return and the ledger check
        env:
          KITE_TEST_PG: "Host=localhost;Port=5432;Username=postgres;Password=postgres"
          KITE_P11_WORKERS: "16"
          KITE_P11_SALES: "10"
          KITE_P11_REPORT: ${{ github.workspace }}/phase11-report.json
        run: dotnet test tests/Kite.IntegrationTests -c Release --no-build --filter "FullyQualifiedName~Phase11ExitGateTests|FullyQualifiedName~Phase11Tests" --logger "console;verbosity=detailed"
      - name: Report
        if: always()
        run: |
          test -f phase11-report.json && cat phase11-report.json
          test -f phase11-report.json && python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          d = json.load(open('phase11-report.json'))
          print('### Phase 11 exit gate\n')
          print(f"{d['workers']} workers per race, {d['sales']} till sales, in {d['seconds']} s.\n")
          print('| Race | Succeeded | Refused | Result |\n| --- | ---: | --- | ---: |')
          for k, v in d['races'].items(): print(f"| {k} | {v['Ok']} | {v['Refused']} | {[x for x in v.values()][-1]} |")
          print('\n| Ledger | Branch | Subledger | Control | Difference |\n| --- | --- | ---: | ---: | ---: |')
          for r in d['reconciliation']: print(f"| {r['ledger']} | {r.get('branchCode') or 'business'} | {r['subledger']} | {r['control']} | {r['difference']} |")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase11-report
          path: phase11-report.json

  pocs-linux:
    name: Proofs of concept (QuestPDF Arabic, ESC/POS raster, SQLCipher)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: QuestPDF Arabic invoice
        run: dotnet run --project poc/questpdf-arabic -c Release -- poc/questpdf-arabic/output/arabic-invoice.pdf
      - name: Inspect the PDF (fonts, text, page image for review)
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          pdffonts poc/questpdf-arabic/output/arabic-invoice.pdf
          pdftotext -layout poc/questpdf-arabic/output/arabic-invoice.pdf - | head -20
          pdftoppm -r 60 -png -singlefile poc/questpdf-arabic/output/arabic-invoice.pdf poc/questpdf-arabic/output/page1
          echo "PAGE1-PNG-BASE64-BEGIN"; base64 -w0 poc/questpdf-arabic/output/page1.png; echo; echo "PAGE1-PNG-BASE64-END"
      - name: Arabic raster receipt (ESC/POS bytes)
        working-directory: poc/escpos-raster
        run: npm ci && npm start
      - name: SQLCipher encrypted emergency store
        working-directory: poc/sqlcipher-store
        run: npm ci && npm start
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc-output-linux
          path: poc/**/output/

  poc-windows-postgres:
    name: Proof of concept (PostgreSQL as a Windows service)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
