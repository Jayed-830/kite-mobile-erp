          echo "=== stub ==="; cat "$RUNNER_TEMP/stub.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-phase7-screenshots
          path: ${{ runner.temp }}/e2e-phase7-shots/

