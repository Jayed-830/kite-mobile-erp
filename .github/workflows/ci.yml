name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  database:
    name: Database tests (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run migrations and SQL tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash db/tests/run.sh

  server-linux:
    name: Server build and tests (Linux + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Kite.slnx
      - run: dotnet build Kite.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/Kite.UnitTests -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory TestResults
      - name: Integration tests
        env:
          KITE_TEST_PG: "Host=localhost;Port=5432;Username=postgres;Password=postgres"
        run: dotnet test tests/Kite.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx" --logger "console;verbosity=normal" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-test-results-linux
          path: TestResults

  server-windows:
    name: Server build and unit tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Kite.slnx -c Release
      - run: dotnet test tests/Kite.UnitTests -c Release --no-build

  web:
    name: Web app (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: src/client/apps/web/dist

  desktop:
    name: Desktop shell (typecheck, build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/client/apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm run build

  pocs-linux:
    name: Proofs of concept (QuestPDF Arabic, ESC/POS raster, SQLCipher)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: QuestPDF Arabic invoice
        run: dotnet run --project poc/questpdf-arabic -c Release -- poc/questpdf-arabic/output/arabic-invoice.pdf
      - name: Inspect the PDF (fonts, text, page image for review)
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          pdffonts poc/questpdf-arabic/output/arabic-invoice.pdf
          pdftotext -layout poc/questpdf-arabic/output/arabic-invoice.pdf - | head -20
          pdftoppm -r 60 -png -singlefile poc/questpdf-arabic/output/arabic-invoice.pdf poc/questpdf-arabic/output/page1
          echo "PAGE1-PNG-BASE64-BEGIN"; base64 -w0 poc/questpdf-arabic/output/page1.png; echo; echo "PAGE1-PNG-BASE64-END"
      - name: Arabic raster receipt (ESC/POS bytes)
        working-directory: poc/escpos-raster
        run: npm ci && npm start
      - name: SQLCipher encrypted emergency store
        working-directory: poc/sqlcipher-store
        run: npm ci && npm start
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc-output-linux
          path: poc/**/output/

  poc-windows-postgres:
    name: Proof of concept (PostgreSQL as a Windows service)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL as a service, bootstrap and migrate
        shell: pwsh
        run: ./poc/postgres-windows-service/install-service-poc.ps1
      - name: SQLCipher emergency store on Windows
        working-directory: poc/sqlcipher-store
        run: npm ci && npm start
